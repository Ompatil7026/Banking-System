<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Customer Registration</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="/static/css/custom-theme.css" />
    <style>
        body {
            background: #f3f6fb;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .registration-container {
            max-width: 500px;
            margin: auto;
            margin-top: 60px;
            background: #ffffff;
            padding: 35px 30px;
            border-radius: 15px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
        }

        h2 {
            margin-bottom: 25px;
            font-weight: 600;
            text-align: center;
            color: #34495e;
        }

        .form-control, .form-select {
            border-radius: 0.5rem;
            border: 1px solid #ced4da;
        }

        .btn-success {
            width: 100%;
            font-weight: 500;
        }

        .btn-link {
            display: block;
            text-align: center;
            margin-top: 10px;
            text-decoration: none;
            color: #3498db;
        }

        .alert {
            margin-top: 20px;
            font-size: 0.95rem;
        }

        label {
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="registration-container">
    <h2>Customer Registration</h2>
    <form th:action="@{/register}" th:object="${user}" method="post" id="registerForm">
        <div class="mb-3">
            <label>Username</label>
            <input type="text" th:field="*{username}" class="form-control" required/>
        </div>
        <div class="mb-3">
            <label>Email</label>
            <input type="email" th:field="*{email}" class="form-control" required/>
        </div>
        <div class="mb-3">
            <label>Password</label>
            <input type="password" th:field="*{password}" class="form-control" required minlength="6"/>
        </div>
        <div class="mb-3">
            <label for="roleSelect">Select Role</label>
            <select class="form-select" id="roleSelect" th:field="*{role}" required>
                <option value="" disabled selected>Select a role</option>
                <option value="ADMIN">Admin</option>
                <option value="MANAGER">Manager</option>
                <option value="CUSTOMER">Customer</option>
            </select>
        </div>
        <button type="submit" class="btn btn-success">Register</button>
        <a href="/login" class="btn btn-link">Back to Login</a>
    </form>

    <div th:if="${param.error}" class="alert alert-danger">Registration failed</div>
    <div th:if="${param.success}" class="alert alert-success">Registration successful! You can login now.</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/client-validation.js"></script>
</body>
</html>
