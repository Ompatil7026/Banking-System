<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Customer Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        body {
            background: linear-gradient(to right, #dbe6f6, #c5796d);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            padding: 40px 0;
        }
        .dashboard-card {
            background: #fff;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            max-width: 600px;
            margin: auto;
            text-align: center;
        }
        .dashboard-card h2 {
            color: #34495e;
            font-weight: 700;
        }
        .dashboard-card p {
            font-size: 16px;
            color: #666;
        }
        .dashboard-card h4 {
            font-size: 24px;
            margin-top: 20px;
            color: #27ae60;
        }
        .btn-group a {
            margin: 10px 5px;
            min-width: 150px;
        }
        .alert {
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="dashboard-card">
    <h2>Welcome, <span th:text="${account.holderName}">User</span>!</h2>
    <p>Account Number: <span th:text="${account.accountNumber}">123456789</span></p>
    <p>Status: <span th:text="${account.status}">Active</span></p>
    <h4>Current Balance: $<span th:text="${account.balance}">0.00</span></h4>

    <div class="btn-group d-flex flex-wrap justify-content-center">
        <a href="/customer/transfer" class="btn btn-outline-primary shadow-sm">Transfer Funds</a>
        <a href="/customer/transactions" class="btn btn-outline-secondary shadow-sm">Transaction History</a>
        <a href="/logout" class="btn btn-outline-danger shadow-sm">Logout</a>
    </div>

    <div th:if="${param.txnsuccess}" class="alert alert-success">Transfer Successful!</div>
    <div th:if="${param.error}" class="alert alert-danger" th:text="${param.error}"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
