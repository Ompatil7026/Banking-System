<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>Transaction History & Audit Logs</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="/static/css/custom-theme.css" />
    <style>
        .btn-link-fixed {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background-color: #64748b;
            color: white;
            padding: 10px 18px;
            border-radius: 30px;
            font-weight: 600;
            text-decoration: none;
            box-shadow: 0 5px 15px rgba(100, 116, 139, 0.6);
            transition: background-color 0.3s ease;
            z-index: 1000;
        }
        .btn-link-fixed:hover {
            background-color: #475569;
        }
    </style>
</head>
<body>
<div class="container mt-4">

    <!-- Transaction History Section -->
    <h3>Transaction History</h3>
    <a th:href="@{/customer/dashboard}" class="btn btn-link mb-3 btn-link-fixed">Back to Dashboard</a>
    <table class="table table-striped table-bordered">
        <thead class="table-primary">
        <tr>
            <th>Date & Time</th>
            <th>From Account</th>
            <th>To Account</th>
            <th>Amount</th>
            <th>IP Address</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="txn : ${transactions}">
            <td th:text="${#temporals.format(txn.timestamp, 'yyyy-MM-dd HH:mm:ss')}"></td>
            <td th:text="${txn.fromAccount}"></td>
            <td th:text="${txn.toAccount}"></td>
            <td th:text="${#numbers.formatDecimal(txn.amount, 1, 2)}"></td>
            <td th:text="${txn.ipAddress}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(transactions)}">
            <td colspan="5" class="text-center">No transactions found.</td>
        </tr>
        </tbody>
    </table>

    <!-- Optional Pagination -->
    <nav th:if="${page != null}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/customer/transactions(page=${page.number - 1}, size=${page.size})}">Previous</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
                th:classappend="${page.number == i} ? 'active'">
                <a class="page-link"
                   th:href="@{/customer/transactions(page=${i}, size=${page.size})}"
                   th:text="${i + 1}"></a>
            </li>
            <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/customer/transactions(page=${page.number + 1}, size=${page.size})}">Next</a>
            </li>
        </ul>
    </nav>

    <!-- Audit Logs Section -->
    <hr class="my-5"/>
    <h3>Audit Logs</h3>
    <table class="table table-striped table-bordered">
        <thead class="table-secondary">
        <tr>
            <th>Date & Time</th>
            <th>User</th>
            <th>Role</th>
            <th>Action</th>
            <th>IP Address</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="log : ${logs}">
            <td th:text="${#temporals.format(log.timestamp, 'yyyy-MM-dd HH:mm:ss')}"></td>
            <td th:text="${log.user.username}"></td>
            <td th:text="${log.userRole}"></td>
            <td th:text="${log.action}"></td>
            <td th:text="${log.ip}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(logs)}">
            <td colspan="5" class="text-center">No logs available.</td>
        </tr>
        </tbody>
    </table>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
