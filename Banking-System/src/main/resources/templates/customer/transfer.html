<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Fund Transfer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        body {
            background: linear-gradient(to right, #eef2f3, #8e9eab);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            background: #ffffff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border-radius: 15px;
            padding: 40px;
            margin-top: 60px;
            transition: transform 0.3s ease;
        }

        .container:hover {
            transform: scale(1.01);
        }

        h2 {
            color: #333;
            font-weight: 600;
            text-align: center;
            margin-bottom: 30px;
        }

        label {
            font-weight: 500;
        }

        .form-control {
            border-radius: 10px;
            padding: 10px;
            font-size: 1rem;
        }

        .btn-success {
            background: #28a745;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 10px;
            transition: background 0.3s ease;
        }

        .btn-success:hover {
            background: #218838;
        }

        .btn-link {
            text-decoration: none;
            font-weight: 500;
            color: #007bff;
            margin-left: 10px;
        }

        .btn-link:hover {
            text-decoration: underline;
        }

        .alert {
            border-radius: 8px;
            font-size: 0.95rem;
        }

        @media (max-width: 576px) {
            .container {
                padding: 25px;
            }
        }
    </style>
</head>
<body>
<div class="container" style="max-width: 500px;">
    <h2>Transfer Money</h2>
    <form th:action="@{/customer/transfer}" method="post" onsubmit="return validateTransfer();">
        <div class="mb-3">
            <label>To Account Number</label>
            <input type="text" name="toAccount" class="form-control" required/>
        </div>
        <div class="mb-3">
            <label>Amount</label>
            <input type="number" name="amount" class="form-control" min="1" step="0.01" required/>
        </div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        <button type="submit" class="btn btn-success">Transfer</button>
        <a href="/customer/dashboard" class="btn btn-link">Back to Dashboard</a>
    </form>
</div>

<script>
    function validateTransfer() {
        const amount = document.querySelector('input[name="amount"]').value;
        const toAcc = document.querySelector('input[name="toAccount"]').value.trim();

        if (toAcc.length < 6) {
            alert("Account number must be at least 6 digits.");
            return false;
        }

        if (parseFloat(amount) <= 0) {
            alert("Amount must be greater than 0.");
            return false;
        }

        return true;
    }
</script>
</body>
</html>
