<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Customer Accounts</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        /* Fixed Back Button */
        .btn-link {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background-color: #64748b;
            color: white;
            padding: 10px 18px;
            border-radius: 30px;
            font-weight: 600;
            text-decoration: none;
            box-shadow: 0 5px 15px rgba(100, 116, 139, 0.6);
            transition: background-color 0.3s ease;
            z-index: 1000;
        }
        .btn-link:hover {
            background-color: #475569;
        }
    </style>
</head>
<body>
<div class="container mt-4">
    <h3>Customer Accounts</h3>
    <a href="/manager/dashboard" class="btn btn-link mb-3">Back to Dashboard</a>
    <table class="table table-striped table-bordered">
        <thead class="table-primary">
        <tr>
            <th>Account Number</th>
            <th>Holder Name</th>
            <th>Balance</th>
            <th>Status</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="account : ${accountPage.content}">
            <td th:text="${account.accountNumber}"></td>
            <td th:text="${account.holderName}"></td>
            <td th:text="${#numbers.formatDecimal(account.balance, 1, 2)}"></td>
            <td th:text="${account.status}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(accountPage.content)}">
            <td colspan="4" class="text-center">No accounts found.</td>
        </tr>
        </tbody>
    </table>

    <!-- Pagination Controls -->
    <nav>
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${accountPage.first} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/manager/accounts(page=${accountPage.number - 1},size=${accountPage.size})}">Previous</a>
            </li>
            <li class="page-item"
                th:each="i : ${#numbers.sequence(0, accountPage.totalPages - 1)}"
                th:classappend="${accountPage.number == i} ? ' active'">
                <a class="page-link"
                   th:href="@{/manager/accounts(page=${i},size=${accountPage.size})}"
                   th:text="${i+1}"></a>
            </li>
            <li class="page-item" th:classappend="${accountPage.last} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/manager/accounts(page=${accountPage.number + 1},size=${accountPage.size})}">Next</a>
            </li>
        </ul>
    </nav>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
