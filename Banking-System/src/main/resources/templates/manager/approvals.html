<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Account Approvals</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>


    <style>
        /* Fixed Back Button */
        .btn-link {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background-color: #64748b;
            color: white;
            padding: 10px 18px;
            border-radius: 30px;
            font-weight: 600;
            text-decoration: none;
            box-shadow: 0 5px 15px rgba(100, 116, 139, 0.6);
            transition: background-color 0.3s ease;
            z-index: 1000;
        }
        .btn-link:hover {
            background-color: #475569;
        }
    </style>
</head>
<body>
<div class="container mt-4">
    <h3>Account Approval Requests</h3>
    <a href="/manager/dashboard" class="btn btn-link mb-3">Back to Dashboard</a>
    <table class="table table-striped table-bordered">
        <thead class="table-warning">
        <tr>
            <th>Account Number</th>
            <th>Holder Name</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="account : ${approvals}">
            <td th:text="${account.accountNumber}"></td>
            <td th:text="${account.holderName}"></td>
            <td th:text="${account.status}"></td>
            <td>
                <form th:action="@{/manager/approvals/approve/{id}(id=${account.id})}" method="post" style="display:inline;">
                    <button class="btn btn-success btn-sm" type="submit">Approve</button>
                </form>

                <form th:action="@{/manager/approvals/reject/{id}(id=${account.id})}" method="post" style="display:inline;">
                    <button class="btn btn-danger btn-sm" type="submit">Reject</button>
                </form>
            </td>
        </tr>

        <tr th:if="${#lists.isEmpty(approvals)}">
            <td colspan="4" class="text-center">No pending approvals.</td>
        </tr>
        </tbody>
    </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
