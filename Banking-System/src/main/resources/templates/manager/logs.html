<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Activity Logs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

    <style>
        /* Fixed Back Button */
        .btn-link {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background-color: #64748b;
            color: white;
            padding: 10px 18px;
            border-radius: 30px;
            font-weight: 600;
            text-decoration: none;
            box-shadow: 0 5px 15px rgba(100, 116, 139, 0.6);
            transition: background-color 0.3s ease;
            z-index: 1000;
        }
        .btn-link:hover {
            background-color: #475569;
        }
    </style>
</head>
<body>
<div class="container mt-4">
    <h3>Audit Logs</h3>
    <a href="/manager/dashboard" class="btn btn-link mb-3">Back to Dashboard</a>
    <table class="table table-striped table-bordered">
        <thead class="table-secondary">
        <tr>
            <th>Date & Time</th>
            <th>User</th>
            <th>Role</th>
            <th>Action</th>
            <th>IP Address</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="log : ${logs}">
            <td th:text="${#temporals.format(log.timestamp, 'yyyy-MM-dd HH:mm:ss')}"></td>
            <td th:text="${log.user.username}"></td>
            <td th:text="${log.userRole}"></td>
            <td th:text="${log.action}"></td>
            <td th:text="${log.ip}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(logs)}">
            <td colspan="5" class="text-center">No logs available.</td>
        </tr>
        </tbody>
    </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
