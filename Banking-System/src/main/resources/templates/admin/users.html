<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin - Manage Users</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        body { background: #f1f5f9; }
        .container { margin-top: 40px; }
        .table th, .table td { vertical-align: middle; }
        .action-btn { min-width: 80px; }
    </style>
</head>
<body>
<div class="container">
    <h2 class="mb-4">Manage All Users</h2>
    <table class="table table-hover table-bordered">
        <thead class="table-primary">
        <tr>
            <th>Username</th>
            <th>Email</th>
            <th>Role</th>
            <th>Status</th>
            <th class="text-center">Operations</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${users}">
            <td th:text="${user.username}"></td>
            <td th:text="${user.email}"></td>
            <td th:text="${user.role}"></td>
            <td>
                <span th:text="${user.enabled ? 'Active' : 'Disabled'}"
                      th:classappend="${user.enabled} ? 'badge bg-success' : 'badge bg-secondary'"></span>
            </td>
            <td class="text-center">
                <!-- Delete Button -->
                <form th:action="@{/admin/users/delete/{id}(id=${user.id})}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-danger btn-sm action-btn"
                            onclick="return confirm('Are you sure you want to delete this user?');">
                        Delete
                    </button>
                </form>
                <!-- Add more operation buttons here (Edit, Change Role, etc.) -->
            </td>
        </tr>
        </tbody>
    </table>
    <a href="/admin/dashboard" class="btn btn-link mt-3">Back to Dashboard</a>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
