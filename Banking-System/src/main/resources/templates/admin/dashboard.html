<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Dashboard - Manage Users</title>
    <style>
        /* Base styles */
        body {
          font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
          background-color: #f4f6f8;
          margin: 0; padding: 2rem;
          color: #333;
        }

        h1 {
          color: #2c3e50;
          text-align: center;
          margin-bottom: 2rem;
          font-weight: 700;
        }

        table {
          width: 100%;
          border-collapse: collapse;
          background: white;
          border-radius: 8px;
          box-shadow: 0 2px 6px rgba(0,0,0,0.1);
          overflow: hidden;
        }

        th, td {
          padding: 12px 20px;
          text-align: left;
          border-bottom: 1px solid #e1e8ee;
          font-size: 0.95rem;
        }

        th {
          background-color: #3498db;
          color: white;
          font-weight: 600;
          text-transform: uppercase;
          letter-spacing: 0.05em;
        }

        tr:hover {
          background-color: #f0f4fb;
        }

        /* Role badges */
        .badge {
          display: inline-block;
          padding: 5px 12px;
          border-radius: 20px;
          font-size: 0.8rem;
          font-weight: 600;
          color: white;
          user-select: none;
        }

        .badge.admin {
          background-color: #e74c3c;
        }
        .badge.manager {
          background-color: #27ae60;
        }
        .badge.customer {
          background-color: #2980b9;
        }

        /* Status badges */
        .status-active {
          color: #16a34a;
          font-weight: 600;
        }

        .status-disabled {
          color: #6b7280;
          font-weight: 600;
        }

        /* Buttons */
        .btn {
          padding: 7px 14px;
          border: none;
          border-radius: 6px;
          font-weight: 600;
          cursor: pointer;
          transition: background-color 0.25s ease;
        }

        .btn-edit {
          background-color: #3b82f6;
          color: white;
          box-shadow: 0 3px 6px rgba(59, 130, 246, 0.5);
          margin-right: 8px;
        }

        .btn-edit:hover {
          background-color: #2563eb;
        }

        .btn-delete {
          background-color: #ef4444;
          color: white;
          box-shadow: 0 3px 6px rgba(239, 68, 68, 0.5);
        }

        .btn-delete:hover {
          background-color: #b91c1c;
        }

        /* Add user button */
        .btn-add-user {
          background-color: #10b981;
          color: white;
          font-weight: 700;
          display: inline-block;
          padding: 12px 24px;
          border-radius: 30px;
          text-decoration: none;
          margin-bottom: 1rem;
          box-shadow: 0 5px 15px rgba(16, 185, 129, 0.4);
          transition: background-color 0.3s ease;
        }

        .btn-add-user:hover {
          background-color: #0f766e;
          box-shadow: 0 8px 20px rgba(15, 118, 110, 0.6);
        }

        /* Responsive */
        @media (max-width: 720px) {
          body {
            padding: 1rem;
          }
          table, th, td {
            font-size: 0.85rem;
          }
          .btn {
            padding: 6px 10px;
            font-size: 0.85rem;
          }
          .btn-add-user {
            padding: 10px 18px;
            font-size: 1rem;
            width: 100%;
            text-align: center;
          }
        }

        /* Fixed Back Button */
        .btn-back {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background-color: #64748b;
            color: white;
            padding: 10px 18px;
            border-radius: 30px;
            font-weight: 600;
            text-decoration: none;
            box-shadow: 0 5px 15px rgba(100, 116, 139, 0.6);
            transition: background-color 0.3s ease;
            z-index: 1000;
        }
        .btn-back:hover {
            background-color: #475569;
        }
    </style>
</head>
<body>

<h1>Admin Dashboard - Manage Users</h1>

<a href="/admin/users/add" class="btn-add-user">+ Add New User</a>

<table>
    <thead>
    <tr>
        <th>Username</th>
        <th>Email</th>
        <th>Role</th>
        <th>Status</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="user : ${users}">
        <td th:text="${user.username}"></td>
        <td th:text="${user.email}"></td>
        <td>
            <span th:text="${user.role}"
                  th:classappend="${user.role.toLowerCase() == 'admin'} ? ' badge admin' :
                                   (${user.role.toLowerCase() == 'manager'} ? ' badge manager' : ' badge customer')">
            </span>
        </td>
        <td>
            <span th:text="${user.enabled} ? 'Active' : 'Disabled'"
                  th:classappend="${user.enabled} ? ' status-active' : ' status-disabled'"></span>
        </td>
        <td>
            <button class="btn btn-edit"
                    th:onclick="'window.location.href=\'/admin/users/edit/' + ${user.id} + '\' '">
                Edit
            </button>
            <form th:action="@{/admin/users/delete/{id}(id=${user.id})}" method="post" style="display:inline"
                  onsubmit="return confirm('Are you sure you want to delete this user?');">
                <button type="submit" class="btn btn-delete">Delete</button>
            </form>
        </td>
    </tr>

    </tbody>
</table>


<a href="/login" class="btn-back" title="Back to Admin Dashboard">Back to Login</a>

</body>
</html>
